[project]
name = "exceptiondesk"
version = "0.1.0"
description = "Evidence kernel and adapters"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "pypdf>=6.21.2,<7",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
