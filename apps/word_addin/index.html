<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>CaseProof evidence search</title>
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="demo-session.js"></script>
  <script defer src="taskpane.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">CaseProof · development</p>
    <h1>Find evidence</h1>
    <p class="notice">Development only. Use synthetic documents. Word-host and confidential-data acceptance are pending.</p>
    <p>Select an assertion in Word, then search the current matter.</p>
    <label for="query">Words to find</label>
    <input id="query" type="search" maxlength="120" autocomplete="off">
    <button id="inspect" disabled>Search evidence</button>
    <p id="status" role="status" aria-live="polite">Waiting for Word…</p>
    <section id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">Selected assertion</h2>
      <blockquote id="selection"></blockquote>
      <p id="coverage"></p>
      <div id="hits"></div>
    </section>
  </main>
</body>
</html>
