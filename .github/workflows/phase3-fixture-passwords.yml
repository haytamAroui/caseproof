name: Phase 3 fixed dev fixture passwords
on:
  push:
    branches: [feat/phase3-ocr-geometry-crops]
    paths:
      - scripts/phase3_reset_fixture_passwords.py
      - .github/workflows/phase3-fixture-passwords.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reset-dev-passwords:
    environment: caseproof-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
      CASEPROOF_PHASE3_PASSWORD_RESET: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: uv run python -m scripts.phase3_reset_fixture_passwords
