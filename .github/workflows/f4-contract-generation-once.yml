name: F4 contract generation one-shot
on:
  push:
    branches: [feat/m3-f4-v31-reviewer-closure]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          ref: feat/m3-f4-v31-reviewer-closure
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - run: uv run --locked python -m scripts.generate_frontend_contract
      - run: npm ci && npm run contracts:generate && npx prettier --write src/shared/api
        working-directory: frontend
      - name: Commit generated contracts and remove one-shot workflow
        run: |
          git config user.name 'caseproof-contract-bot'
          git config user.email 'caseproof-contract-bot@users.noreply.github.com'
          git add frontend/src/shared/api
          git rm .github/workflows/f4-contract-generation-once.yml
          git commit -m 'F4: commit generated Python JSON Schema, TypeScript and AJV contract artifacts'
          git push origin HEAD:feat/m3-f4-v31-reviewer-closure
