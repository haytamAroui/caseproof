name: M5 signed 150-page dossier benchmark
# Trigger protected branch acceptance on this commit; do not merge without zero-residual evidence.
on:
  push:
    branches: [feat/final-hardening-and-verification]
    paths:
      - scripts/m5_benchmark_live_acceptance.py
      - scripts/m5_generate_stress_docx.py
      - tests/test_m5_discovery_sequence_security.py
      - scripts/m5_benchmark_live.py
      - apps/api/supabase_headless_matter_store.py
      - apps/api/litigation_headless_verification.py
      - apps/api/dev_live_entry.py
      - scripts/m05_live.py
      - scripts/m05_registry.py
      - scripts/teardown_test_run.py
      - scripts/reap_stale_runs.py
      - supabase/migrations/20261030115000_m05_protected_registry_rpc.sql
      - supabase/migrations/20261030120000_m05_verify_empty.sql
      - scripts/verify_dev_ephemeral_auth.py
      - tests/fixtures/run_lifecycle.py
      - tests/fixtures/factory.py
      - tests/test_fixture_factory.py
      - .github/workflows/m5-benchmark-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    environment: caseproof-dev
    timeout-minutes: 20
    env:
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
      CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
      CASEPROOF_PHASE3_LIVE: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-fra poppler-utils fonts-dejavu-core
      - name: Validate reusable fixture factory offline
        run: uv run --locked --with pytest --with python-docx --with reportlab --with pillow python -m pytest -q tests/test_fixture_factory.py
      - name: Hostile DOCX injection and discovery egress regression
        run: uv run --locked --with pytest --with python-docx python -m pytest -q tests/test_m5_discovery_sequence_security.py
      - name: Execute signed 150-page 60-reference stress dossier and teardown
        run: uv run --with python-docx --with reportlab --with pillow python -m scripts.m5_benchmark_live

      - name: Upload signed acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-final-benchmark-receipt
          path: /tmp/caseproof-final-receipt/*
          if-no-files-found: warn
