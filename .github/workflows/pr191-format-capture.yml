name: PR191 one-time formatting capture
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/pr191-format-capture.yml'
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.head_ref == 'feat/word-document-editor-tracked-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Format targeted frontend source
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/prettier --write src/features/docx-editor/DocxEditor.tsx src/features/docx-editor/DocxEditor.css src/features/docx-editor/NativeWordHandoff.tsx src/shared/api/transport.ts src/shared/api/transport.test.ts
      - name: Emit exact formatted source
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for (const f of [
            'src/features/docx-editor/DocxEditor.tsx',
            'src/features/docx-editor/DocxEditor.css',
            'src/features/docx-editor/NativeWordHandoff.tsx',
            'src/shared/api/transport.ts',
            'src/shared/api/transport.test.ts'
          ]) console.log('CASEPROOF_FORMAT_CAPTURE:' + f + ':' + fs.readFileSync(f).toString('base64'));
          NODE
