name: PR191 one-time older DOCX fixture cleanup
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/pr191-owned-old-cleanup.yml
permissions:
  contents: read
jobs:
  scoped_cleanup:
    if: github.repository == 'haytamAroui/caseproof' && github.head_ref == 'feat/word-document-editor-tracked-changes' && github.event.pull_request.head.repo.full_name == github.repository
    environment: caseproof-dev
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: Exact-owned historical DOCX fixture Auth/ledger teardown
        run: uv run --locked python -m scripts.teardown_failed_docx_live
