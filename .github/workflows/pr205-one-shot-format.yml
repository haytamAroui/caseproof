name: PR205 one-shot formatter
on:
  push:
    branches: [feat/p0-evidence-falsification-paraphrase-guard]
    paths:
      - .github/workflows/pr205-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.ref == 'refs/heads/feat/p0-evidence-falsification-paraphrase-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/p0-evidence-falsification-paraphrase-guard
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: Ruff fix and formatting on new P0 module only
        run: |
          uv run --locked ruff check --fix application/litigation/paraphrase_guard.py tests/test_paraphrase_guard.py tests/test_p0_review_benchmark_manifest.py
          uv run --locked ruff format application/litigation/paraphrase_guard.py tests/test_paraphrase_guard.py tests/test_p0_review_benchmark_manifest.py
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run pinned Prettier on exact changed frontend paths
        working-directory: frontend
        run: |
          npx prettier --write src/features/review/ReviewPanel.tsx src/features/verification/ReportScreen.tsx tests/review.spec.ts
      - name: Commit formatter result without merging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/litigation/paraphrase_guard.py tests/test_paraphrase_guard.py tests/test_p0_review_benchmark_manifest.py frontend/src/features/review/ReviewPanel.tsx frontend/src/features/verification/ReportScreen.tsx frontend/tests/review.spec.ts
          if git diff --cached --quiet; then
            echo 'P0 changes already formatted'
          else
            git commit -m 'style(PR205): apply pinned Ruff and Prettier to P0 safeguards'
            git push origin HEAD:feat/p0-evidence-falsification-paraphrase-guard
          fi
