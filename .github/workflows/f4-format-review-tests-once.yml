name: F4 review contract test formatting one-shot
on:
  push:
    branches: [feat/m3-f4-v31-reviewer-closure]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          ref: feat/m3-f4-v31-reviewer-closure
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx prettier --write src/shared/api/review.ts src/shared/api/review.test.ts
        working-directory: frontend
      - name: Commit formatted source and remove temporary workflow
        run: |
          git config user.name 'caseproof-contract-bot'
          git config user.email 'caseproof-contract-bot@users.noreply.github.com'
          git add frontend/src/shared/api/review.ts frontend/src/shared/api/review.test.ts
          git rm .github/workflows/f4-format-review-tests-once.yml
          git commit -m 'F4: format strict review contract boundary tests'
          git push origin HEAD:feat/m3-f4-v31-reviewer-closure
