name: Frontend foundation
on:
  pull_request:
  push:
    branches: [main, feat/frontend-foundation]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/client/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - run: uv run --locked python -m scripts.generate_frontend_contract --check
      - run: uv run --locked pytest -q tests/test_frontend_contract.py
      - run: uv run --locked ruff check application/litigation/frontend_contract.py scripts/generate_frontend_contract.py tests/test_frontend_contract.py
      - run: uv run --locked mypy --explicit-package-bases application/litigation/frontend_contract.py scripts/generate_frontend_contract.py
      - run: npm ci
        working-directory: apps/web/client
      - run: npm run contracts:check && npm run lint && npm test && npm run build
        working-directory: apps/web/client
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web/client
      - run: npm run test:e2e
        working-directory: apps/web/client
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-synthetic-browser-evidence
          path: |
            apps/web/client/test-results
            apps/web/client/playwright-report
          retention-days: 7
