name: Frontend foundation
on:
  pull_request:
  push:
    branches: [main, feat/frontend-foundation, feat/m3-rules]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - run: uv run --locked python -m scripts.generate_frontend_contract --check
      - name: Check generated Python JSON Schema artifacts are committed
        run: git diff --exit-code -- frontend/src/shared/api/*.schema.json
      - run: uv run --locked pytest -q tests/test_contract_boundary_hardening.py tests/test_f3_v31_hardening.py tests/test_f4_v31_review.py tests/test_workspace_intake.py tests/test_frontend_contract.py tests/test_workspace_catalog.py tests/test_clearbrief_signed_matter_catalog.py tests/test_workspace_auth.py tests/test_workspace_reports.py tests/test_dossier_viewer.py
      - run: uv run --locked ruff check apps/api/dossier_journey.py tests/test_f4_v31_review.py apps/api/workspace_intake.py tests/test_workspace_intake.py apps/api/dossier_viewer.py application/litigation/viewer_contract.py scripts/generate_viewer_fixtures.py tests/test_dossier_viewer.py apps/api/workspace_auth.py apps/api/workspace_reports.py scripts/workspace_browser_live.py scripts/verify_workspace_reports_disposable.py tests/test_workspace_auth.py tests/test_workspace_reports.py application/litigation/workspace_contract.py apps/api/workspace_catalog.py tests/test_workspace_catalog.py application/litigation/frontend_contract.py scripts/generate_frontend_contract.py tests/test_frontend_contract.py
      - run: uv run --locked mypy --explicit-package-bases apps/api/dossier_journey.py apps/api/workspace_intake.py apps/api/dossier_viewer.py application/litigation/viewer_contract.py apps/api/workspace_auth.py apps/api/workspace_reports.py application/litigation/workspace_contract.py apps/api/workspace_catalog.py application/litigation/frontend_contract.py scripts/generate_frontend_contract.py
      - name: Generate deterministic viewer fixtures without a server renderer
        run: uv run --locked python -m scripts.generate_viewer_fixtures --out frontend/tests/viewer-comparison/generated/fixtures
      - run: npm ci
        working-directory: frontend
      - name: Check locked production dependency graph and generate local SBOM
        working-directory: frontend
        run: |
          npm ls --omit=dev --all
          npm sbom --omit=dev --sbom-format=cyclonedx > "$RUNNER_TEMP/caseproof-web-sbom.json"
          node -e "const fs=require('node:fs'); const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/caseproof-web-sbom.json')); if(!Array.isArray(s.components) || !s.components.length) process.exit(1)"
      - name: Record reproducible Python lockfile dependency tree
        run: uv tree --locked --depth 2 > "$RUNNER_TEMP/caseproof-python-dependencies.txt"
      - name: Enforce M3 design, database and security policy
        run: npm run policy:check
        working-directory: frontend
      - name: Surface expected Prettier output for a failing source check
        working-directory: frontend
        run: |
          if ! npx prettier --check src/features/corrections/CorrectionPanel.tsx; then
            echo BEGIN_CASEPROOF_PRETTIER
            npx prettier src/features/corrections/CorrectionPanel.tsx | base64 -w0
            echo
            echo END_CASEPROOF_PRETTIER
          fi
      - run: npm run contracts:check && npm run lint && npm test && npm run build
        working-directory: frontend
      - name: Check generated TypeScript and AJV artifacts are committed
        run: git diff --exit-code -- frontend/src/shared/api
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-synthetic-browser-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
