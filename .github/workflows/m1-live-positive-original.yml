name: CaseProof LIVE M1 authorized original / existing-object isolation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: caseproof-m1-live-positive-dev
  cancel-in-progress: false
jobs:
  signed-live:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'haytamAroui/caseproof' }}
    runs-on: ubuntu-latest
    environment: caseproof-dev-live-auth
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Verify fixture script and immutable Storage contract offline
        run: uv run --locked pytest -q tests/test_m1_live_positive_original_contract.py
      - name: Real 3-user Supabase auth + private matter + existing-file isolation + revocation + cleanup
        env:
          CASEPROOF_DEV_LIVE_POSITIVE: "YES"
          CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
          CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
        run: uv run --locked python -m scripts.verify_m1_live_positive_original
      - name: Report scope precisely
        if: always()
        run: |
          {
            echo "## Actual live CaseProof-dev checks"
            echo ""
            echo "- Genuine dev Auth accounts, PostgREST metadata, and private Storage: **remote Supabase**, not disposable Postgres."
            echo "- Authorized synthetic original upload, SHA readback, existing-object cross-user denial, grant revocation and fixture cleanup: **the protected test step must pass**."
            echo "- No separate remote database password or new GitHub secret."
            echo "- This workflow does **not** run or attest live M2 check/review/correction/recheck."
            echo "- Word and customer release are outside this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
