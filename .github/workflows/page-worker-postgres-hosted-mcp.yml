name: PostgreSQL process recovery and hosted MCP OAuth acceptance
on:
  pull_request:
    paths:
      - 'apps/api/hosted_mcp_app.py'
      - 'apps/api/supabase_oauth_mcp_verifier.py'
      - 'apps/api/hosted_mcp_oauth_boundary.py'
      - 'apps/api/hosted_mcp_release_gate.py'
      - 'apps/api/mcp_adapter_contract.py'
      - 'apps/api/signed_page_jobs.py'
      - 'apps/worker/signed_page_worker.py'
      - 'scripts/verify_page_worker_postgres_process.py'
      - 'tests/test_hosted_mcp_app.py'
      - 'tests/test_hosted_mcp_release_gate.py'
      - 'tests/test_supabase_oauth_mcp_verifier.py'
      - 'supabase/migrations/**'
      - '.github/workflows/page-worker-postgres-hosted-mcp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: MCP stateless OAuth HTTP and negative security acceptance
        run: uv run --locked pytest -q tests/test_hosted_mcp_app.py tests/test_hosted_mcp_release_gate.py tests/test_hosted_mcp_oauth_boundary.py tests/test_supabase_oauth_mcp_verifier.py tests/test_mcp_canonical_dossier.py tests/test_mcp_http_parity.py
      - name: Verify HTTP/security lint
        run: uv run --locked ruff check apps/api/hosted_mcp_app.py apps/api/supabase_oauth_mcp_verifier.py apps/api/hosted_mcp_release_gate.py tests/test_hosted_mcp_app.py tests/test_hosted_mcp_release_gate.py tests/test_supabase_oauth_mcp_verifier.py
  postgres-real-process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: caseproof_s2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: caseproof_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caseproof_s2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      CASEPROOF_DISPOSABLE_DB: 'YES'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: caseproof_s2_ci
      PGUSER: postgres
      PGPASSWORD: caseproof_ephemeral_ci
      CASEPROOF_OCR_SANDBOX: docker
      CASEPROOF_OCR_IMAGE: caseproof-ocr-worker:ci
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: Install isolated PostgreSQL and OCR clients
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-nld tesseract-ocr-fra fonts-dejavu-core
      - name: Build isolated OCR container
        run: docker build -f docker/ocr-worker.Dockerfile -t caseproof-ocr-worker:ci .
      - name: Initialize *disposable* full RLS/dossier/PostgreSQL page-job schema
        run: uv run --locked python -m scripts.verify_dossier_disposable
      - name: Prove 200-page crash, actual PostgreSQL claim/takeover, receipts and revoke
        run: uv run --locked python -m scripts.verify_page_worker_postgres_process
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: postgres-real-process-recovery-receipt
          path: /tmp/caseproof-postgres-recovery
          retention-days: 7
