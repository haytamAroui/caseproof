name: Memory protocol
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate-memory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate memory schema
        run: python scripts/check_memory.py --mode validate
      - name: Require memory updates for code PRs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_memory.py --mode pr --base "$BASE_SHA"
