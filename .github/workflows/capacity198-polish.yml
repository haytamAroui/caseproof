name: PR198 one-time browser test Prettier
on:
  push:
    branches: [feat/pilot-capacity-envelope]
    paths: [.github/workflows/capacity198-polish.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format new browser boundary test
        working-directory: frontend
        run: |
          npm ci
          npx --no-install prettier --write tests/intake.spec.ts
      - name: Commit formatted test
        run: |
          git diff --check
          git add frontend/tests/intake.spec.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format browser capacity refusal test"
            git push origin HEAD:feat/pilot-capacity-envelope
          fi
