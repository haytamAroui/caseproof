name: F4 final source formatting and build one-shot
on:
  push:
    branches: [feat/m3-f4-v31-reviewer-closure]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          ref: feat/m3-f4-v31-reviewer-closure
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm ci
          npx prettier --write src/features/review/ReviewPanel.tsx src/shared/api/review.ts tests/review.spec.ts src/shared/api/review.test.ts
          npm run contracts:check
          npm run lint
          npm test
          npm run build
        working-directory: frontend
      - name: Commit formatting and remove temporary runner
        run: |
          git config user.name 'caseproof-contract-bot'
          git config user.email 'caseproof-contract-bot@users.noreply.github.com'
          git add frontend
          git rm .github/workflows/f4-verify-authored-once.yml
          git commit -m 'F4: format review inputs and verify contract/lint/unit/build'
          git push origin HEAD:feat/m3-f4-v31-reviewer-closure
