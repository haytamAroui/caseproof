name: PR196 capture exact CSS formatting
on:
  push:
    branches: [feat/storyteller-cockpit-redesign]
    paths:
      - .github/workflows/pr196-css-format-capture.yml
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.ref == 'refs/heads/feat/storyteller-cockpit-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format and publish deterministic CSS chunks for branch owner
        working-directory: frontend
        run: |
          npx prettier --write src/app/theme.css
          python3 - <<'PY'
          import json
          from pathlib import Path
          content = Path("src/app/theme.css").read_text()
          print("PR196_CSS_FMT_START", flush=True)
          for i in range(0, len(content), 2000):
              print("PR196_CSS_FMT_CHUNK " + json.dumps(content[i:i+2000], ensure_ascii=True), flush=True)
          print("PR196_CSS_FMT_END", flush=True)
          PY
