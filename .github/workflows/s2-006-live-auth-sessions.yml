name: S2-006 Real Supabase Auth sessions (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    # Never run automatically on PRs and never provision users.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Validate genuine, separate development Auth user sessions
        # Only the probe process receives secrets, never earlier setup actions.
        env:
          CASEPROOF_LIVE_AUTH_TEST: "YES"
          CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
          CASEPROOF_DEV_AUTH_A_EMAIL: ${{ secrets.CASEPROOF_DEV_AUTH_A_EMAIL }}
          CASEPROOF_DEV_AUTH_A_PASSWORD: ${{ secrets.CASEPROOF_DEV_AUTH_A_PASSWORD }}
          CASEPROOF_DEV_AUTH_B_EMAIL: ${{ secrets.CASEPROOF_DEV_AUTH_B_EMAIL }}
          CASEPROOF_DEV_AUTH_B_PASSWORD: ${{ secrets.CASEPROOF_DEV_AUTH_B_PASSWORD }}
        run: uv run --locked python scripts/verify_s2_006_live_auth.py
