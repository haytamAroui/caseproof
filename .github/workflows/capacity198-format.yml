name: PR198 temporary formatter
on:
  push:
    branches: [feat/pilot-capacity-envelope]
    paths: [.github/workflows/capacity198-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Apply locked Python formatter
        run: |
          uv run --locked ruff check --fix application/capacity_envelope.py apps/api/workspace_intake.py apps/api/signed_document_parse.py apps/api/dossier_journey.py apps/api/dossier_export_release.py scripts/measure_pilot_envelope.py scripts/dossier_live.py scripts/workspace_intake_live.py scripts/generate_frontend_contract.py tests/test_capacity_envelope.py tests/test_capacity_page_recovery.py
          uv run --locked ruff format application/capacity_envelope.py apps/api/workspace_intake.py apps/api/signed_document_parse.py apps/api/dossier_journey.py apps/api/dossier_export_release.py scripts/measure_pilot_envelope.py scripts/dossier_live.py scripts/workspace_intake_live.py scripts/generate_frontend_contract.py tests/test_capacity_envelope.py tests/test_capacity_page_recovery.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply locked frontend formatter
        working-directory: frontend
        run: |
          npm ci
          npx --no-install prettier --write src/features/intake/IntakeScreen.tsx src/features/intake/files.ts src/shared/api/intake.test.ts
      - name: Commit formatting to PR branch
        run: |
          git diff --check
          git add application/capacity_envelope.py apps/api/workspace_intake.py apps/api/signed_document_parse.py apps/api/dossier_journey.py apps/api/dossier_export_release.py scripts/measure_pilot_envelope.py scripts/dossier_live.py scripts/workspace_intake_live.py scripts/generate_frontend_contract.py tests/test_capacity_envelope.py tests/test_capacity_page_recovery.py frontend/src/features/intake/IntakeScreen.tsx frontend/src/features/intake/files.ts frontend/src/shared/api/intake.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format pilot capacity implementation"
            git push origin HEAD:feat/pilot-capacity-envelope
          fi
