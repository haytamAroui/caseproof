name: PR197 branch-local format (temporary)
on:
  push:
    branches:
      - feat/release-completeness-policy-t30-t31
    paths:
      - .github/workflows/release197-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Format Python release changes
        run: |
          uv run --locked ruff check --fix \
            application/litigation/release_completeness.py \
            apps/api/dossier_export_release.py \
            tests/test_f6_reviewed_exports.py
          uv run --locked ruff format \
            application/litigation/release_completeness.py \
            apps/api/dossier_export_release.py \
            application/litigation/report_projection.py \
            infrastructure/parsers/dossier_docx_export.py \
            tests/test_f6_reviewed_exports.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format React and TypeScript changes
        working-directory: frontend
        run: |
          npm ci
          npx --no-install prettier --write \
            src/features/exports/api.ts \
            src/features/exports/ExportsScreen.tsx \
            src/features/exports/api.test.ts \
            tests/exports.spec.ts
      - name: Commit only formatter results to PR branch
        run: |
          git diff --check
          git add \
            application/litigation/release_completeness.py \
            apps/api/dossier_export_release.py \
            application/litigation/report_projection.py \
            infrastructure/parsers/dossier_docx_export.py \
            tests/test_f6_reviewed_exports.py \
            frontend/src/features/exports/api.ts \
            frontend/src/features/exports/ExportsScreen.tsx \
            frontend/src/features/exports/api.test.ts \
            frontend/tests/exports.spec.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: apply repository formatters to release policy changes"
            git push origin HEAD:feat/release-completeness-policy-t30-t31
          fi
