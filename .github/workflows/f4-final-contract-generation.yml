name: F4 final generated contracts and UI formatting one-shot
on:
  push:
    branches: [feat/m3-f4-v31-reviewer-closure]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          ref: feat/m3-f4-v31-reviewer-closure
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - run: uv run --locked python -m scripts.generate_frontend_contract
      - run: npm ci && npm run contracts:generate && npm run contracts:check
        working-directory: frontend
      - name: Format authored F4 code only (never exact generated artifacts)
        run: npx prettier --write src/features/review src/features/verification/ReportScreen.tsx src/app/App.tsx src/features/evidence/SourceViewer.tsx src/shared/api/review.ts tests/review.spec.ts
        working-directory: frontend
      - name: Commit and remove one-time generator
        run: |
          git config user.name 'caseproof-contract-bot'
          git config user.email 'caseproof-contract-bot@users.noreply.github.com'
          git add frontend
          git rm .github/workflows/f4-final-contract-generation.yml
          git commit -m 'F4: regenerate exact review contracts and format reviewed UI source'
          git push origin HEAD:feat/m3-f4-v31-reviewer-closure
