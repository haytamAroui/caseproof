name: PR174 genuine signed historical report and raster acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-historical:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    environment: caseproof-dev
    timeout-minutes: 25
    env:
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
      CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
      CASEPROOF_PHASE3_LIVE: "YES"
      CASEPROOF_WORKSPACE_ENABLED: "YES"
      CASEPROOF_F1_BROWSER_LIVE: "YES"
      CASEPROOF_F2_BROWSER_LIVE: "YES"
      CASEPROOF_PR174_BROWSER_LIVE: "YES"
      CASEPROOF_OCR_SANDBOX: docker
      CASEPROOF_OCR_IMAGE: caseproof-ocr-worker:ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Build isolated OCR worker
        run: docker build -f docker/ocr-worker.Dockerfile -t caseproof-ocr-worker:ci .
      - name: Install local raster/OCR system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-fra poppler-utils fonts-dejavu-core
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Build locked browser and validate generated contracts
        run: npm ci && npm run contracts:check && npm run build
        working-directory: frontend
      - name: Install Chromium
        run: uv run --locked python -m playwright install --with-deps chromium
      - name: Execute signed A to B historical browsing and zero-residual teardown
        run: uv run --locked python -m scripts.dossier_live
