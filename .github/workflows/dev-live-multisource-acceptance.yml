name: M1 live multi-source acceptance (protected)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caseproof-dev-live-multisource
  cancel-in-progress: false

jobs:
  live-multisource:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'haytamAroui/caseproof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: caseproof-dev
    env:
      CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
      CASEPROOF_DEV_LIVE_MULTISOURCE: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Protected live multi-source acceptance
        run: uv run --locked python -m scripts.verify_dev_live_multisource
