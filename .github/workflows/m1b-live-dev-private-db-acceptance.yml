{
  "name": "M1-B actual dev DB signed-user RLS acceptance (manual protected)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "caseproof-m1b-ephemeral-private-auth",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'haytamAroui/caseproof' }}",
      "environment": "caseproof-dev-live-auth",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v7.0.1",
          "with": {
            "ref": "main",
            "persist-credentials": false
          }
        },
        {
          "uses": "astral-sh/setup-uv@v10.3.2",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Test live acceptance guardrails without network",
          "run": "uv run --locked pytest -q tests/test_m1_live_dev_private_rls.py"
        },
        {
          "name": "Verify actual signed users and exact private RLS on installed dev DB",
          "env": {
            "CASEPROOF_M1_LIVE_PRIVATE_DB_ACCEPTANCE": "YES",
            "CASEPROOF_M1_LIVE_DB_APPROVED": "YES",
            "CASEPROOF_DEV_PUBLISHABLE_KEY": "${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}",
            "CASEPROOF_DEV_AUTH_ADMIN_KEY": "${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}",
            "CASEPROOF_DEV_DB_ADMIN_DSN": "${{ secrets.CASEPROOF_DEV_DB_ADMIN_DSN }}",
            "CASEPROOF_DEV_DB_CA_PEM": "${{ secrets.CASEPROOF_DEV_DB_CA_PEM }}"
          },
          "run": "uv run --locked python -m scripts.verify_m1_live_dev_private_rls"
        }
      ]
    }
  }
}
