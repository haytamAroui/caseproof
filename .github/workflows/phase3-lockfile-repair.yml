name: Phase 3 lockfile reconciliation
on:
  push:
    branches: [feat/phase3-ocr-geometry-crops]
    paths:
      - .github/workflows/phase3-lockfile-repair.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Resolve and validate lockfile
        run: |
          uv lock --upgrade-package pillow
          uv sync --locked --group dev
          uv lock --check
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "fix(ci): regenerate uv lock with full Pillow distributions"
            git push origin HEAD:feat/phase3-ocr-geometry-crops
          fi
