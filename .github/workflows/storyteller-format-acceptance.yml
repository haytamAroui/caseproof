name: Storyteller cockpit formatting acceptance
on:
  push:
    branches:
      - feat/storyteller-cockpit-redesign
    paths:
      - .github/workflows/storyteller-format-acceptance.yml
      - frontend/src/app/App.tsx
      - frontend/src/app/MatterJourney.tsx
      - frontend/src/shared/ui/SplitHandle.tsx
      - frontend/src/shared/ui/SplitHandle.test.ts
      - frontend/src/app/theme.css
      - frontend/src/features/verification/ReportScreen.tsx
      - frontend/src/features/exports/ExportsScreen.tsx
      - frontend/tests/workspace.spec.ts
      - frontend/tests/viewer.spec.ts
      - frontend/src/features/docx-editor/DocxEditor.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.ref == 'refs/heads/feat/storyteller-cockpit-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/storyteller-cockpit-redesign
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: frontend
      - name: Format reviewed cockpit and export changes
        working-directory: frontend
        run: |
          npx prettier --write \
            src/app/App.tsx \
            src/app/MatterJourney.tsx \
            src/shared/ui/SplitHandle.tsx \
            src/shared/ui/SplitHandle.test.ts \
            src/app/theme.css \
            src/features/verification/ReportScreen.tsx \
            src/features/exports/ExportsScreen.tsx \
            src/features/exports/api.ts \
            src/features/exports/api.test.ts \
            tests/workspace.spec.ts \
            tests/viewer.spec.ts \
            src/features/docx-editor/DocxEditor.css \
            tests/exports.spec.ts \
            ../docs/STORYTELLER_DESIGN_AUDIT.md
      - name: Commit exact Prettier result to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/app/App.tsx frontend/src/app/MatterJourney.tsx \
            frontend/src/shared/ui/SplitHandle.tsx frontend/src/shared/ui/SplitHandle.test.ts \
            frontend/src/app/theme.css frontend/src/features/verification/ReportScreen.tsx \
            frontend/src/features/exports/ExportsScreen.tsx \
            frontend/src/features/exports/api.ts frontend/src/features/exports/api.test.ts \
            frontend/tests/workspace.spec.ts frontend/tests/exports.spec.ts \
            frontend/tests/viewer.spec.ts frontend/src/features/docx-editor/DocxEditor.css \
            docs/STORYTELLER_DESIGN_AUDIT.md
          if git diff --cached --quiet; then
            echo 'All authored cockpit files already formatted'
          else
            git commit -m 'style(cockpit): format seven-step workflow and evidence-first reader'
            git push origin HEAD:feat/storyteller-cockpit-redesign
          fi
