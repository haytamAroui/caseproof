name: Synthetic scanned PDF OCR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Build isolated OCR runtime
        run: docker build -f docker/ocr-worker.Dockerfile -t caseproof-ocr-worker:ci .
      - name: Install local OCR and synthetic fixture tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng imagemagick fonts-dejavu-core
      - name: Verify image-only synthetic PDF through real OCR
        env:
          CASEPROOF_REAL_OCR: "YES"
          CASEPROOF_OCR_SANDBOX: docker
          CASEPROOF_OCR_IMAGE: caseproof-ocr-worker:ci
        run: uv run --locked pytest -q tests/test_real_scan_ocr.py
