name: F4 last UI format one-shot
on:
  push:
    branches: [feat/m3-f4-v31-reviewer-closure]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          ref: feat/m3-f4-v31-reviewer-closure
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx prettier --write src/features/verification/ReportScreen.tsx src/features/review/ReviewPanel.tsx src/app/theme.css
        working-directory: frontend
      - name: Commit formatted files and remove one-shot runner
        run: |
          git config user.name 'caseproof-contract-bot'
          git config user.email 'caseproof-contract-bot@users.noreply.github.com'
          git add frontend
          git rm .github/workflows/f4-last-ui-format-once.yml
          git commit -m 'F4: format final reviewer interface and CSS'
          git push origin HEAD:feat/m3-f4-v31-reviewer-closure
