name: F6 temporary formatter diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.head_ref == 'feat/f6-reviewed-export-and-historical-reopen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Print exact pinned Prettier output for F6 browser test
        working-directory: frontend
        run: |
          npx prettier --write tests/exports.spec.ts
          echo F6_FORMATTED_BEGIN
          cat tests/exports.spec.ts
          echo F6_FORMATTED_END
