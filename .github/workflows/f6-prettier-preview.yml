name: F6 temporary formatter diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.head_ref == 'feat/f6-reviewed-export-and-historical-reopen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format changed files and show patch for reviewed application
        working-directory: frontend
        run: |
          npx prettier --write src/features/exports/api.test.ts src/features/exports/api.ts src/features/exports/ExportsScreen.tsx src/features/verification/ReportScreen.tsx src/shared/api/transport.ts
          git diff -- src/features/exports/api.test.ts src/features/exports/api.ts src/features/exports/ExportsScreen.tsx src/features/verification/ReportScreen.tsx src/shared/api/transport.ts
