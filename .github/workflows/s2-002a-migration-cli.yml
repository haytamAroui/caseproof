name: S2-002A canonical migration integrity
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/s2-002a-migration-cli.yml'
      - '.github/workflows/kernel-boundary.yml'
      - 'db/proposals/S2-002_tenant_foundation.sql'
      - 'db/proposals/PIV-M1_DEV_atomic_private_grant_install.sql'
      - 'scripts/verify_s2_002_database.py'
      - 'docs/tasks/S2-002A.md'
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  canonical-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify canonical migration against reviewed proposal
        run: |
          set -euo pipefail
          file='supabase/migrations/20261022001009_caseproof_tenant_foundation.sql'
          test -f "$file"
          cmp "$file" db/proposals/S2-002_tenant_foundation.sql
          sha256sum "$file" db/proposals/S2-002_tenant_foundation.sql
          private='supabase/migrations/20261027160745_caseproof_m1_dev_atomic_private_grants.sql'
          test -f "$private"
          cmp "$private" db/proposals/PIV-M1_DEV_atomic_private_grant_install.sql
          sha256sum "$private" db/proposals/PIV-M1_DEV_atomic_private_grant_install.sql
          python3 - <<'PY'
          import re
          from pathlib import Path

          def normalize(source: str) -> str:
              source = re.sub(r'(^|\n)begin;\s*\n', '\n', source, count=1, flags=re.I)
              source = re.sub(r'\ncommit;\s*$', '\n', source, count=1, flags=re.I)
              return source

          for path, proposal in (
              ('20261027195417_caseproof_m2_dev_atomic_private_review.sql',
               'PIV-M2_DEV_atomic_private_review_candidate.sql'),
              ('20261027195451_caseproof_m1_signed_invoker_read_views.sql',
               'PIV-M1_signed_invoker_read_api_candidate.sql'),
          ):
              actual = (Path('supabase/migrations') / path).read_text()
              expected = normalize((Path('db/proposals') / proposal).read_text())
              if actual != expected:
                  raise SystemExit(f'Migration diverged from deployed reviewed SQL: {path}')
          print('M1_M2_DEPLOYED_MIGRATION_PAYLOADS_MATCH_PROPOSALS')
          PY
          storage='supabase/migrations/20261027202734_caseproof_m1_private_originals_storage.sql'
          test -f "$storage"
          cmp "$storage" db/proposals/PIV-M1_DEV_private_originals_storage.sql
          sha256sum "$storage" db/proposals/PIV-M1_DEV_private_originals_storage.sql
          correction='supabase/migrations/20261027204343_caseproof_m1_storage_upload_action_correction.sql'
          test -f "$correction"
          cmp "$correction" db/proposals/PIV-M1_DEV_storage_upload_action_correction.sql
          sha256sum "$correction" db/proposals/PIV-M1_DEV_storage_upload_action_correction.sql
          fixture='supabase/migrations/20261027214851_caseproof_m1_dev_live_positive_fixture_rpc.sql'
          test -f "$fixture"
          cmp "$fixture" db/proposals/PIV-M1_DEV_live_positive_fixture_rpc.sql
          test "$(find supabase/migrations -type f -name '*.sql' | wc -l)" -eq 32
      - name: Cross-check with pinned official Supabase CLI
        run: |
          set -euo pipefail
          npx --yes supabase@2.121.0 --version
          npx --yes supabase@2.121.0 migration new --help >/dev/null
          scratch="$(mktemp -d)"
          cp db/proposals/S2-002_tenant_foundation.sql "$scratch/source.sql"
          (
            cd "$scratch"
            npx --yes supabase@2.121.0 migration new caseproof_tenant_foundation < source.sql
            cmp source.sql supabase/migrations/*_caseproof_tenant_foundation.sql
          )
          echo 'S2-002A_CANONICAL_MIGRATION_VERIFIED'
