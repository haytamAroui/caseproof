name: P1 one-shot pinned Ruff formatter
on:
  push:
    branches: [feat/p1-controlled-reviewer-benchmark]
    paths:
      - .github/workflows/p1-one-shot-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.ref == 'refs/heads/feat/p1-controlled-reviewer-benchmark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/p1-controlled-reviewer-benchmark
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: Format only P1 engine and tests using pinned Ruff
        run: |
          uv run --locked ruff check --fix \
            application/litigation/reviewer_benchmark.py \
            scripts/p1_reviewer_benchmark.py \
            tests/test_p1_reviewer_benchmark.py \
            tests/test_p1_reviewer_benchmark_cli.py
          uv run --locked ruff format \
            application/litigation/reviewer_benchmark.py \
            scripts/p1_reviewer_benchmark.py \
            tests/test_p1_reviewer_benchmark.py \
            tests/test_p1_reviewer_benchmark_cli.py
      - name: Commit exact format on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add application/litigation/reviewer_benchmark.py scripts/p1_reviewer_benchmark.py \
            tests/test_p1_reviewer_benchmark.py tests/test_p1_reviewer_benchmark_cli.py
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(P1): run pinned Ruff formatter'
            git push origin HEAD:feat/p1-controlled-reviewer-benchmark
          fi
