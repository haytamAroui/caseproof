name: Storyteller Motion lockfile update
on:
  workflow_dispatch:
  push:
    branches:
      - feat/storyteller-cockpit-redesign
    paths:
      - frontend/package.json
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/storyteller-cockpit-redesign
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve and install Motion with npm
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "build(frontend): lock Motion React dependency"
          git push origin HEAD:feat/storyteller-cockpit-redesign
