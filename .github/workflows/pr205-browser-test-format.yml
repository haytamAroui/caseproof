name: PR205 browser test one-shot format
on:
  push:
    branches: [feat/p0-evidence-falsification-paraphrase-guard]
    paths:
      - .github/workflows/pr205-browser-test-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.ref == 'refs/heads/feat/p0-evidence-falsification-paraphrase-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/p0-evidence-falsification-paraphrase-guard
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format exact browser regression only
        run: npx prettier --write tests/review.spec.ts
        working-directory: frontend
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/tests/review.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(PR205): format guarded-term browser acceptance'
            git push origin HEAD:feat/p0-evidence-falsification-paraphrase-guard
          fi
