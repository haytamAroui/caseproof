{
  "name": "S2-007 Signed Auth and disposable RLS (manual only)",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'haytamAroui/caseproof' }}",
      "environment": "caseproof-dev-live-auth",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "services": {
        "postgres": {
          "image": "postgres:17",
          "env": {
            "POSTGRES_DB": "caseproof_s2_ci",
            "POSTGRES_USER": "postgres",
            "POSTGRES_PASSWORD": "caseproof_ephemeral_ci"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd \"pg_isready -U postgres -d caseproof_s2_ci\" --health-interval 5s --health-timeout 5s --health-retries 8"
        }
      },
      "env": {
        "CASEPROOF_DISPOSABLE_DB": "YES",
        "PGHOST": "127.0.0.1",
        "PGPORT": "5432",
        "PGDATABASE": "caseproof_s2_ci",
        "PGUSER": "postgres",
        "PGPASSWORD": "caseproof_ephemeral_ci"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main",
            "persist-credentials": false
          }
        },
        {
          "name": "Check trusted Python 3.11+",
          "run": "python3 -c 'import sys; assert sys.version_info >= (3, 11)'"
        },
        {
          "name": "Install PostgreSQL client for disposable localhost service",
          "run": "sudo apt-get update -qq && sudo apt-get install -y postgresql-client"
        },
        {
          "name": "Verify genuine sessions then disposable PostgreSQL RLS",
          "env": {
            "CASEPROOF_LIVE_AUTH_TEST": "YES",
            "CASEPROOF_S2_007_REAL_AUTH": "YES",
            "CASEPROOF_DEV_PUBLISHABLE_KEY": "${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}",
            "CASEPROOF_DEV_AUTH_A_EMAIL": "${{ secrets.CASEPROOF_DEV_AUTH_A_EMAIL }}",
            "CASEPROOF_DEV_AUTH_A_PASSWORD": "${{ secrets.CASEPROOF_DEV_AUTH_A_PASSWORD }}",
            "CASEPROOF_DEV_AUTH_B_EMAIL": "${{ secrets.CASEPROOF_DEV_AUTH_B_EMAIL }}",
            "CASEPROOF_DEV_AUTH_B_PASSWORD": "${{ secrets.CASEPROOF_DEV_AUTH_B_PASSWORD }}"
          },
          "run": "python3 -m scripts.verify_s2_007_disposable_tenancy"
        }
      ]
    }
  }
}
