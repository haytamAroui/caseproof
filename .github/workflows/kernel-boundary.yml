name: Kernel boundary
on:
  pull_request:
  push:
    branches: [main]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Verify architecture boundaries
        run: uv run --locked python scripts/check_architecture.py
      - name: Run unit tests
        run: uv run --locked pytest -q
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Mypy check
        run: uv run --locked mypy packages/evidence_kernel apps/api/contracts_v2.py apps/api/access_control.py
      - name: Python compilation
        run: uv run --locked python -m compileall -q packages domains apps
