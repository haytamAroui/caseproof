name: Kernel boundary
on:
  pull_request:
  push:
    branches: [main]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: Verify architecture boundaries
        run: uv run --locked python scripts/check_architecture.py
      - name: Run unit tests
        run: uv run --locked pytest -q
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Mypy check
        run: uv run --locked mypy --explicit-package-bases packages/evidence_kernel apps/api/contracts_v2.py apps/api/access_control.py apps/api/supabase_auth_verifier.py apps/api/postgres_case_repository.py apps/api/supabase_password_signin.py apps/api/live_auth_probe.py apps/api/internal_observation_contract.py apps/api/evidence_locator_codec.py apps/api/postgres_evidence_reader.py apps/api/evidence_vault_protocol.py domains/finance/reconciliation.py domains/finance/candidate_policy.py apps/api/synthetic_finance.py scripts/demo_synthetic_finance.py
      - name: Type check Evidence Intelligence runtime and adapters
        run: uv run --locked mypy --explicit-package-bases application/extraction apps/api/requesty_extraction.py apps/api/disposable_extraction_journal.py domains/finance/extraction_rules.py domains/construction
      - name: Type check document intake, parsers and evaluation
        run: uv run --locked mypy --explicit-package-bases application/documents infrastructure/parsers apps/api/authenticated_document_intelligence.py evals
      - name: Type check review and draft export
        run: uv run --locked mypy --explicit-package-bases application/review application/dossiers apps/api/review_workbench.py apps/api/disposable_review_repository.py apps/api/synthetic_review_app.py scripts/review_demo_fixture.py
      - name: Type check leased extraction worker
        run: uv run --locked mypy --explicit-package-bases application/runtime infrastructure/execution apps/worker apps/api/extraction_scheduler.py
      - name: Type check M1 litigation reference modules
        run: uv run --locked mypy --explicit-package-bases domains/disputes application/litigation apps/api/authenticated_evidence_library.py
      - name: Type check M2 headless private-matter API
        run: uv run --locked mypy --explicit-package-bases apps/api/litigation_check_service.py apps/api/litigation_check_app.py
      - name: Type check M2 review, brief, private composition and correction lifecycle
        run: uv run --locked mypy --explicit-package-bases apps/api/disposable_litigation_review_ledger.py apps/api/disposable_litigation_brief_graph.py apps/api/postgres_litigation_check_store.py apps/api/disposable_litigation_corrections.py
      - name: Verify synthetic M2 factual-check through correction and recheck
        run: uv run --locked python -m scripts.demo_litigation_m2
      - name: Type check M1 completion candidate adapters
        run: uv run --locked mypy --explicit-package-bases application/litigation/exhibit_confirmation.py infrastructure/persistence apps/api/restricted_case_repository.py apps/api/litigation_evidence_app.py infrastructure/parsers/pdf_ocr.py
      - name: Verify synthetic M1 evidence-library journey
        run: uv run --locked python -m scripts.demo_litigation_evidence_library
      - name: Verify reviewer browser journey
        env:
          CASEPROOF_BROWSER_LOG_SCREENSHOT: "YES"
        run: uv run --locked python -m scripts.verify_review_browser
      - name: Verify reviewer UI contracts
        run: uv run --locked python scripts/check_review_ui.py
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-review-browser
          path: /tmp/caseproof-review-browser
      - name: Python compilation
        run: uv run --locked python -m compileall -q packages domains apps
      - name: Type check disposable Vault adapters
        run: uv run --locked mypy --explicit-package-bases apps/api/disposable_postgres_vault_ledger.py apps/api/private_filesystem_byte_store.py apps/api/disposable_text_evidence.py

  database-security:
    name: Disposable PostgreSQL concurrency and audit regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: caseproof_s2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: caseproof_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caseproof_s2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      CASEPROOF_DISPOSABLE_DB: "YES"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: caseproof_s2_ci
      PGUSER: postgres
      PGPASSWORD: caseproof_ephemeral_ci
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - name: Install PostgreSQL test client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run PostgreSQL RLS, concurrent CAS and audit-failure negative tests
        run: |
          uv run --locked python scripts/verify_s2_002_database.py
          uv run --locked python -m scripts.verify_m1_disposable_exhibits
          CASEPROOF_S2_007_SYNTHETIC=YES uv run --locked python -m scripts.verify_s2_007_disposable_tenancy
          uv run --locked python -m scripts.verify_s2_004_database
          uv run --locked python -m scripts.verify_s2_008a_database
          uv run --locked python -m scripts.verify_s2_008a3_reader
          uv run --locked python -m scripts.verify_s2_009b_database
      - name: Verify Vault coordinator with real PostgreSQL and private bytes
        run: uv run --locked python -m scripts.verify_vault_integration
      - name: Resolve persisted text evidence after process restart
        run: uv run --locked python -m scripts.verify_text_anchor_integration
      - name: Verify durable extraction recovery, scope, CAS and audit rollback
        run: uv run --locked python -m scripts.verify_extraction_integration
      - name: Verify document intake to extraction with real private bytes and PostgreSQL
        run: uv run --locked python -m scripts.verify_document_intake_integration
      - name: Verify atomic review recommendations and draft export
        run: uv run --locked python -m scripts.verify_review_integration
      - name: Verify worker leases, checkpoint fences and process recovery
        run: uv run --locked python -m scripts.verify_worker_integration
      - name: Verify M2 immutable check runs and reviewer CAS on real disposable PostgreSQL
        run: uv run --locked python -m scripts.verify_m2_disposable_runs
      - name: Verify M2 original-byte-bound immutable brief graph, CAS and audit rollback
        run: uv run --locked python -m scripts.verify_m2_brief_graph
      - name: Verify private-matter check composition through persisted review
        run: uv run --locked python -m scripts.verify_m2_private_check_composition
      - name: Verify durable M2 correction plan, immutable source replay and recheck
        run: uv run --locked python -m scripts.verify_m2_disposable_corrections
      - name: Verify default-private case, evidence and grant RLS under disposable authenticated role
        run: uv run --locked python -m scripts.verify_m1_private_rls
