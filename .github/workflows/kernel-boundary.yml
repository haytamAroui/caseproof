name: Kernel boundary
on:
  pull_request:
  push:
    branches: [main]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce kernel import boundary
        run: python scripts/check_architecture.py
      - name: Run domain unit tests
        run: python -m unittest discover -s tests -v
