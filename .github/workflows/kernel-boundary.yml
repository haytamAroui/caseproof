name: Kernel boundary
on:
  pull_request:
  push:
    branches: [main]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Verify architecture boundaries
        run: uv run --locked python scripts/check_architecture.py
      - name: Run unit tests
        run: uv run --locked pytest -q
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Mypy check
        run: uv run --locked mypy --explicit-package-bases packages/evidence_kernel apps/api/contracts_v2.py apps/api/access_control.py apps/api/supabase_auth_verifier.py apps/api/postgres_case_repository.py apps/api/supabase_password_signin.py apps/api/live_auth_probe.py apps/api/internal_observation_contract.py apps/api/evidence_locator_codec.py apps/api/postgres_evidence_reader.py
      - name: Python compilation
        run: uv run --locked python -m compileall -q packages domains apps

  database-security:
    name: Disposable PostgreSQL concurrency and audit regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: caseproof_s2_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: caseproof_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d caseproof_s2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      CASEPROOF_DISPOSABLE_DB: "YES"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: caseproof_s2_ci
      PGUSER: postgres
      PGPASSWORD: caseproof_ephemeral_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install PostgreSQL test client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Run PostgreSQL RLS, concurrent CAS and audit-failure negative tests
        run: |
          uv run --locked python scripts/verify_s2_002_database.py
          CASEPROOF_S2_007_SYNTHETIC=YES uv run --locked python -m scripts.verify_s2_007_disposable_tenancy
          uv run --locked python -m scripts.verify_s2_004_database
          uv run --locked python -m scripts.verify_s2_008a_database
          uv run --locked python -m scripts.verify_s2_008a3_reader
