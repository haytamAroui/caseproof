name: Kernel boundary
on:
  pull_request:
  push:
    branches: [main]
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Verify architecture boundaries
        run: uv run --locked python scripts/check_architecture.py
      - name: Run unit tests
        run: uv run --locked pytest -q
