name: One-shot F3 generated-contract regeneration
on:
  push:
    branches: [feat/m3-f3-v31-intake-hardening]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'haytamAroui/caseproof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate canonical Python schemas
        run: uv run --locked python -m scripts.generate_frontend_contract
      - name: Generate TypeScript and AJV
        run: npm ci && npm run contracts:generate
        working-directory: frontend
      - name: Apply formatters to modified source
        run: |
          uv run --locked ruff format apps/api/dossier_journey.py apps/api/workspace_intake.py application/litigation/frontend_contract.py domains/disputes/dossier_verification.py domains/disputes/page_labels.py tests/test_f3_v31_hardening.py
          cd frontend
          npx prettier --write src/features/intake/IntakeScreen.tsx src/features/intake/InventoryScreen.tsx src/shared/api/contracts.ts src/shared/api/index.ts src/shared/api/intake.ts src/shared/api/confirmation.schema.json src/shared/api/intake.schema.json src/shared/api/dossier.schema.json src/shared/api/confirmation-generated.ts src/shared/api/intake-generated.ts src/shared/api/confirmation-generated-validator.js src/shared/api/intake-generated-validator.js tests/intake.spec.ts
      - name: Commit generated source and delete one-shot workflow
        run: |
          rm .github/workflows/f3-v31-one-shot-generation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(f3): synchronized schemas AJV TypeScript and formatters'
          git push origin HEAD:feat/m3-f3-v31-intake-hardening
