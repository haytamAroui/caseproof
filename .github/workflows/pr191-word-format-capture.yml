name: PR191 one-time native Word formatting capture
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/pr191-word-format-capture.yml'
permissions:
  contents: read
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.head_ref == 'feat/word-document-editor-tracked-changes'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Format native Word handoff
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/prettier --write src/features/docx-editor/NativeWordHandoff.tsx
      - name: Capture exact formatted source
        working-directory: frontend
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/features/docx-editor/NativeWordHandoff.tsx';
          console.log('CASEPROOF_FORMAT_CAPTURE:' + path + ':' + fs.readFileSync(path).toString('base64'));
          NODE
