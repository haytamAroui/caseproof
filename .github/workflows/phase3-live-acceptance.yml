name: M0.5 Phase 3 nine-step acceptance (requires ephemeral provisioning)
on:
  push:
    branches: [feat/m05-ephemeral-fixture-hardening]
    paths:
      - scripts/phase3_live_acceptance.py
      - tests/fixtures/run_lifecycle.py
      - tests/fixtures/factory.py
      - tests/test_fixture_factory.py
      - .github/workflows/phase3-live-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    environment: caseproof-dev
    timeout-minutes: 20
    env:
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
      CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
      CASEPROOF_PHASE3_LIVE: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - name: Install OCR system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-fra poppler-utils fonts-dejavu-core
      - name: Validate reusable fixture factory offline
        run: uv run --locked --with pytest --with python-docx --with reportlab --with pillow python -m pytest -q tests/test_fixture_factory.py
      # Fail closed: a standalone nine-step run would leave data behind.
      # Do not enable live acceptance until durable registry + teardown exist.
      - name: Block unsafe live acceptance until M0.5 lifecycle is complete
        run: |
          echo "::error::M0.5 BLOCKED: durable cloud registry and scoped teardown not yet implemented"
          exit 1
