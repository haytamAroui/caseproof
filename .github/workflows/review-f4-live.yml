name: F4 genuine signed reviewer acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  live:
    if: github.repository == 'haytamAroui/caseproof' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'feat/m3-f4-v31-reviewer-closure' || github.head_ref == 'feat/p2-reviewer-workspace-reconciliation')
    runs-on: ubuntu-latest
    environment: caseproof-dev
    timeout-minutes: 20
    env:
      CASEPROOF_DEV_AUTH_ADMIN_KEY: ${{ secrets.CASEPROOF_DEV_AUTH_ADMIN_KEY }}
      CASEPROOF_DEV_PUBLISHABLE_KEY: ${{ secrets.CASEPROOF_DEV_PUBLISHABLE_KEY }}
      CASEPROOF_PHASE3_LIVE: "YES"
      CASEPROOF_WORKSPACE_ENABLED: "YES"
      CASEPROOF_F3_BROWSER_LIVE: "YES"
      CASEPROOF_F4_BROWSER_LIVE: "YES"
      CASEPROOF_OCR_SANDBOX: docker
      CASEPROOF_OCR_IMAGE: caseproof-ocr-worker:ci
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"
      - run: docker build -f docker/ocr-worker.Dockerfile -t caseproof-ocr-worker:ci .
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-fra poppler-utils fonts-dejavu-core
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci && npm run contracts:check && npm run build
        working-directory: frontend
      - run: uv run --locked python -m playwright install --with-deps chromium
      - name: Real Auth upload, source, review, lost ACK, receipt and cold restart
        run: uv run --locked python -m scripts.dossier_live
