name: PR196 Storyteller layout formatting
on:
  push:
    branches: [feat/storyteller-cockpit-redesign]
    paths:
      - .github/workflows/pr196-layout-format.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'haytamAroui/caseproof' && github.ref == 'refs/heads/feat/storyteller-cockpit-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/storyteller-cockpit-redesign
          persist-credentials: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Apply repository-pinned Prettier to layout and tests
        working-directory: frontend
        run: |
          npx prettier --write \
            src/app/App.tsx \
            src/app/PrimaryNavigation.tsx \
            src/app/theme.css \
            src/features/verification/ReportScreen.tsx \
            src/shared/ui/SplitHandle.tsx \
            tests/viewer.spec.ts \
            tests/workspace.spec.ts \
            BLUEPRINT.md \
            ../docs/STORYTELLER_DESIGN_AUDIT.md
      - name: Commit exact formatted code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/app/App.tsx frontend/src/app/PrimaryNavigation.tsx \
            frontend/src/app/theme.css frontend/src/features/verification/ReportScreen.tsx \
            frontend/src/shared/ui/SplitHandle.tsx frontend/tests/viewer.spec.ts \
            frontend/tests/workspace.spec.ts frontend/BLUEPRINT.md \
            docs/STORYTELLER_DESIGN_AUDIT.md
          if git diff --cached --quiet; then
            echo 'Storyteller layout already formatted'
          else
            git commit -m 'style(PR196): apply pinned formatting to reference-parity cockpit'
            git push origin HEAD:feat/storyteller-cockpit-redesign
          fi
